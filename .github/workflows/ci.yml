name: CI

on:
  push:
    branches:
      - main
      - ios
      - android
  pull_request:
    branches:
      - main
      - ios
      - android

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pytest
        run: python -m pytest

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android/FootballLotteryAndroid
        run: ./gradlew assembleDebug --no-daemon --console=plain
